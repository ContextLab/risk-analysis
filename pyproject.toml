[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskdyn"
version = "0.1.0"
description = "Conversation and position dynamics in online Risk"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "platformdirs>=4.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "torch>=2.2",
    "torchvision>=0.17",  # required by transformers' SAM image processor
    "transformers>=4.38",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
riskdyn = "riskdyn.cli:main"

[tool.setuptools.packages.find]
include = ["riskdyn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test performs a real HTTP request to dominating12.com",
]
